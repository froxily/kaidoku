name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run tests
        run: ./mvnw -B verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports/

  e2e:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run E2E tests
        run: ./mvnw -B verify -Pe2e -De2e.browser.channel=chrome
      - name: Upload E2E test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-surefire-reports
          path: target/surefire-reports/

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t kaidoku:ci .
      - name: Smoke test container
        run: |
          docker run -d --name kaidoku -p 8080:8080 kaidoku:ci
          for i in $(seq 1 60); do curl -sf http://localhost:8080/api/patterns > /dev/null && break; sleep 1; done
          curl -sf http://localhost:8080/api/patterns | python3 -c 'import sys, json; n = len(json.load(sys.stdin)); print(n, "patterns"); assert n > 0'
          curl -sf -X POST http://localhost:8080/api/analyze -H 'Content-Type: application/json' -d '{"text": "高いわけではない。"}' \
            | python3 -c 'import sys, json; ids = [m["ruleId"] for m in json.load(sys.stdin)["matches"]]; print(ids); assert "wake-dewa-nai" in ids'
          test "$(docker exec kaidoku id -u)" != "0"
          docker rm -f kaidoku

  publish:
    needs: [test, e2e, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
      SOURCE: ${{ github.server_url }}/${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - name: Log in to GHCR
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
      - name: Build and push image
        run: |
          docker build --label "org.opencontainers.image.source=$SOURCE" --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "$IMAGE" .
          docker push "$IMAGE"
      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io
